[project]
name = "skillhub-server-python"
version = "0.1.0"
description = "FastAPI backend for the full-Python SkillHub runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4",
  "asyncpg>=0.30.0",
  "bcrypt>=5.0.0",
  "boto3>=1.39.0",
  "fastapi>=0.116.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
