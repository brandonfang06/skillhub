[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillhub-oss-source-importer"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
skillhub-oss-import = "skillhub_oss_importer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<8.4",
    "ruff>=0.12,<1",
    "tomli>=2; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/skillhub_oss_importer"]
