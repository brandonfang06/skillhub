services:
  skill-scanner:
    image: ${SKILLHUB_SCANNER_IMAGE:-ghcr.io/iflytek/skillhub-scanner}:${SKILLHUB_VERSION:-latest}
    restart: unless-stopped
    environment:
      SKILL_SCANNER_LLM_API_KEY: ${SKILL_SCANNER_LLM_API_KEY:-}
      SKILL_SCANNER_LLM_BASE_URL: ${SKILL_SCANNER_LLM_BASE_URL:-}
      SKILL_SCANNER_LLM_MODEL: ${SKILL_SCANNER_LLM_MODEL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillhub}
      POSTGRES_USER: ${POSTGRES_USER:-skillhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillhub_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillhub} -d ${POSTGRES_DB:-skillhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${SKILLHUB_SERVER_IMAGE:-ghcr.io/iflytek/skillhub-server-python}:${SKILLHUB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SKILLHUB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillhub}:${POSTGRES_PASSWORD:-skillhub_demo}@postgres:5432/${POSTGRES_DB:-skillhub}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_DATABASE: 0
      SKILLHUB_RATELIMIT_ENABLED: ${SKILLHUB_RATELIMIT_ENABLED:-false}
      SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_RESOLVE_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_RESOLVE_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_RESOLVE_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_RESOLVE_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_RESOLVE_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_RESOLVE_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_DOWNLOAD_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_DOWNLOAD_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_DOWNLOAD_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_DOWNLOAD_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_DOWNLOAD_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_DOWNLOAD_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_SKILLS_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_SKILLS_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_SKILLS_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_SKILLS_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_SKILLS_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_SKILLS_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_STARS_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_STARS_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_STARS_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_STARS_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_STARS_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_STARS_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_PUBLISH_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_PUBLISH_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_PUBLISH_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_PUBLISH_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_PUBLISH_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_PUBLISH_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_WHOAMI_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_WHOAMI_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_WHOAMI_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_WHOAMI_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_WHOAMI_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_WHOAMI_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_SESSION_BOOTSTRAP_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_SESSION_BOOTSTRAP_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_SESSION_BOOTSTRAP_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_SESSION_BOOTSTRAP_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_SESSION_BOOTSTRAP_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_SESSION_BOOTSTRAP_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_DIRECT_LOGIN_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_DIRECT_LOGIN_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_DIRECT_LOGIN_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_DIRECT_LOGIN_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_DIRECT_LOGIN_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_DIRECT_LOGIN_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_REQUEST_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_REQUEST_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_REQUEST_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_REQUEST_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_REQUEST_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_CONFIRM_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_CONFIRM_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_CONFIRM_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_CONFIRM_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_REGISTER_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_REGISTER_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_REGISTER_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_REGISTER_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_REGISTER_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_REGISTER_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_LOCAL_LOGIN_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_LOCAL_LOGIN_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_LOCAL_LOGIN_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_LOCAL_LOGIN_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_LOCAL_LOGIN_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_LOCAL_LOGIN_WINDOW_SECONDS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_CHANGE_PASSWORD_AUTHENTICATED: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_CHANGE_PASSWORD_AUTHENTICATED:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_CHANGE_PASSWORD_ANONYMOUS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_CHANGE_PASSWORD_ANONYMOUS:-}
      SKILLHUB_RATELIMIT_CATEGORIES_AUTH_CHANGE_PASSWORD_WINDOW_SECONDS: ${SKILLHUB_RATELIMIT_CATEGORIES_AUTH_CHANGE_PASSWORD_WINDOW_SECONDS:-}
      SKILLHUB_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SKILLHUB_PUBLIC_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:-}
      SKILLHUB_WEB_BASE_PATH: ${SKILLHUB_WEB_BASE_PATH:-}
      SKILLHUB_DEVICE_AUTH_VERIFICATION_URI: ${SKILLHUB_DEVICE_AUTH_VERIFICATION_URI:-}
      DEVICE_AUTH_VERIFICATION_URI: ${DEVICE_AUTH_VERIFICATION_URI:-}
      SKILLHUB_STORAGE_BASE_PATH: /var/lib/skillhub/storage
      SKILLHUB_SECURITY_SCANNER_ENABLED: ${SKILLHUB_SECURITY_SCANNER_ENABLED:-true}
      SKILLHUB_SECURITY_SCANNER_BASE_URL: http://skill-scanner:8000
      SKILLHUB_SECURITY_SCANNER_MODE: upload
      SKILLHUB_PUBLISH_ALLOWED_FILE_EXTENSIONS: ${SKILLHUB_PUBLISH_ALLOWED_FILE_EXTENSIONS:-}
      SKILLHUB_DOWNLOAD_ANALYTICS_RETENTION_MONTHS: ${SKILLHUB_DOWNLOAD_ANALYTICS_RETENTION_MONTHS:-12}
      SKILLHUB_SCAN_CONSUMER_ENABLED: ${SKILLHUB_SCAN_CONSUMER_ENABLED:-false}
      SKILLHUB_SCANNER_USE_BEHAVIORAL: ${SKILLHUB_SCANNER_USE_BEHAVIORAL:-true}
      SKILLHUB_SCANNER_USE_LLM: ${SKILLHUB_SCANNER_USE_LLM:-false}
      SKILLHUB_SCANNER_LLM_PROVIDER: ${SKILLHUB_SCANNER_LLM_PROVIDER:-anthropic}
      SKILLHUB_SCANNER_USE_META: ${SKILLHUB_SCANNER_USE_META:-false}
      SKILLHUB_SCANNER_USE_AI_DEFENSE: ${SKILLHUB_SCANNER_USE_AI_DEFENSE:-false}
      SKILLHUB_SCANNER_AI_DEFENSE_API_KEY: ${SKILLHUB_SCANNER_AI_DEFENSE_API_KEY:-}
      SKILLHUB_SCANNER_USE_VIRUSTOTAL: ${SKILLHUB_SCANNER_USE_VIRUSTOTAL:-false}
      SKILLHUB_SCANNER_USE_TRIGGER: ${SKILLHUB_SCANNER_USE_TRIGGER:-false}
      SKILLHUB_AUTH_DIRECT_ENABLED: ${SKILLHUB_AUTH_DIRECT_ENABLED:-false}
      SKILLHUB_AUTH_SESSION_BOOTSTRAP_ENABLED: ${SKILLHUB_AUTH_SESSION_BOOTSTRAP_ENABLED:-false}
      SKILLHUB_LOCAL_REGISTRATION_ENABLED: ${SKILLHUB_LOCAL_REGISTRATION_ENABLED:-true}
      SKILLHUB_GLOBAL_NAMESPACE_AUTO_JOIN_ENABLED: ${SKILLHUB_GLOBAL_NAMESPACE_AUTO_JOIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USER_ID: ${BOOTSTRAP_ADMIN_USER_ID:-docker-admin}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!2026}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@skillhub.local}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_PROVIDER: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_PROVIDER:-keycloak}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE:-authorization_code}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI:-"{baseUrl}/login/oauth2/code/{registrationId}"}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE:-openid,profile,email}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_NAME: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_NAME:-Keycloak}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI:-}
    volumes:
      - skillhub_storage:/var/lib/skillhub/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: ${SKILLHUB_WEB_IMAGE:-ghcr.io/iflytek/skillhub-web}:${SKILLHUB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      SKILLHUB_API_UPSTREAM: ${SKILLHUB_API_UPSTREAM:-http://server:8080}
      SKILLHUB_TRUST_FORWARDED_PROTO: ${SKILLHUB_TRUST_FORWARDED_PROTO:-false}
      SKILLHUB_WEB_API_BASE_URL: ${SKILLHUB_WEB_API_BASE_URL:-}
      SKILLHUB_PUBLIC_BASE_URL: ${SKILLHUB_PUBLIC_BASE_URL:-}
      SKILLHUB_WEB_BASE_PATH: ${SKILLHUB_WEB_BASE_PATH:-}
      SKILLHUB_WEB_CLI_REGISTRY_URL: ${SKILLHUB_WEB_CLI_REGISTRY_URL:-}
      SKILLHUB_WEB_AUTH_DIRECT_ENABLED: ${SKILLHUB_WEB_AUTH_DIRECT_ENABLED:-false}
      SKILLHUB_WEB_AUTH_DIRECT_PROVIDER: ${SKILLHUB_WEB_AUTH_DIRECT_PROVIDER:-}
      SKILLHUB_LOCAL_REGISTRATION_ENABLED: ${SKILLHUB_LOCAL_REGISTRATION_ENABLED:-true}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  skillhub_storage:
