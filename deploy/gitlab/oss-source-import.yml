# The central pipeline must define a `pull_code` job in an earlier stage. That
# job publishes a dotenv artifact containing the accepted source coordinates:
# SKILLHUB_SOURCE_REPOSITORY_URL, SKILLHUB_SOURCE_REF_TYPE, optional
# SKILLHUB_SOURCE_REF, SKILLHUB_DEV_GITLAB_REPOSITORY_URL,
# SKILLHUB_DEV_GITLAB_BRANCH, SKILLHUB_SOURCE_SCAN_STATUS, and optional
# SKILLHUB_SOURCE_SCAN_ID. The scan status must be PASSED, and the Dev GitLab
# branch must be protected from updates outside the controlled landing flow.
# Concurrent pipelines targeting the same branch must serialize pull_code
# through publish_skillhub, or use an immutable pipeline-specific branch.
# The importer reads `$CI_PROJECT_DIR/pull-code.env` itself and rejects any
# conflicting inherited variable because higher-precedence GitLab variables can
# override dotenv report values. The artifact file is the authoritative handoff.
#
# Required project/group variables: SKILLHUB_PYTHON_IMAGE (immutable Python
# 3.8 + Git image), SKILLHUB_BASE_URL, SKILLHUB_SERVICE_TOKEN (an st_ service
# token), SKILLHUB_NAMESPACE_OWNER_PROVIDER_CODE, and
# SKILLHUB_NAMESPACE_OWNER_LOGIN_NAME. GitLab supplies CI_JOB_TOKEN for the
# cross-project Dev GitLab clone. The Dev project must allow this central
# pipeline project to read it with the job token.

.skillhub_oss_import:
  image:
    name: "$SKILLHUB_PYTHON_IMAGE"
    entrypoint: [""]
  variables:
    SKILLHUB_IMPORT_REPORT_PATH: "skillhub-oss-import-report.json"
  needs:
    - job: pull_code
      artifacts: true
  script:
    - /bin/sh "$CI_PROJECT_DIR/deploy/gitlab/oss-source-import.sh"
  artifacts:
    when: always
    paths:
      - "$SKILLHUB_IMPORT_REPORT_PATH"

skillhub_oss_import:
  extends: .skillhub_oss_import
  stage: publish_skillhub
