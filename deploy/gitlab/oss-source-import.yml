# Required project/group CI variables:
# SKILLHUB_IMPORTER_IMAGE (immutable version tag or digest), SKILLHUB_BASE_URL,
# SKILLHUB_API_TOKEN, SKILLHUB_SOURCE_REPOSITORY_URL,
# SKILLHUB_NAMESPACE_OWNER_PROVIDER_CODE, SKILLHUB_NAMESPACE_OWNER_LOGIN_NAME.

.skillhub_oss_import:
  image: "$SKILLHUB_IMPORTER_IMAGE"
  script:
    - skillhub-oss-import --json-report "$SKILLHUB_IMPORT_REPORT_PATH"
  artifacts:
    when: always
    paths:
      - "$SKILLHUB_IMPORT_REPORT_PATH"

skillhub_oss_import:
  extends: .skillhub_oss_import
  stage: publish
