# Required project/group CI variables:
# SKILLHUB_PYTHON_IMAGE (immutable Python 3.12 + Git image), SKILLHUB_BASE_URL,
# SKILLHUB_SERVICE_TOKEN (an st_ service token),
# SKILLHUB_NAMESPACE_OWNER_PROVIDER_CODE, SKILLHUB_NAMESPACE_OWNER_LOGIN_NAME.
# Required per-pipeline upstream identity input: SKILLHUB_SOURCE_REPOSITORY_URL.
# GitLab supplies the actual internal clone coordinates through CI_REPOSITORY_URL
# and CI_COMMIT_SHA; the importer never clones SKILLHUB_SOURCE_REPOSITORY_URL.

.skillhub_oss_import:
  image:
    name: "$SKILLHUB_PYTHON_IMAGE"
    entrypoint: [""]
  variables:
    SKILLHUB_IMPORT_REPORT_PATH: "skillhub-oss-import-report.json"
  script:
    - /bin/sh "$CI_PROJECT_DIR/deploy/gitlab/oss-source-import.sh"
  artifacts:
    when: always
    paths:
      - "$SKILLHUB_IMPORT_REPORT_PATH"

skillhub_oss_import:
  extends: .skillhub_oss_import
  stage: publish
