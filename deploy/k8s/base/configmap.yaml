apiVersion: v1
kind: ConfigMap
metadata:
  name: skillhub-config
data:
  # External MinIO / S3 storage. If access must go through an internal proxy,
  # set storage-s3-proxy-endpoint and keep storage-s3-endpoint as the canonical
  # MinIO endpoint for documentation parity.
  storage-provider: s3
  storage-s3-endpoint: http://minio.example.internal:9000
  storage-s3-proxy-endpoint: ""
  storage-s3-public-endpoint: https://objects.example.com
  storage-s3-bucket: skillhub-packages
  storage-s3-region: us-east-1
  storage-s3-force-path-style: "true"
  storage-s3-disable-chunked-encoding: "false"
  storage-s3-auto-create-bucket: "false"

  # External Redis. The Python backend also accepts SKILLHUB_REDIS_URL as an
  # override, but these Spring-compatible keys preserve Java deployment parity.
  redis-host: redis.example.internal
  redis-port: "6379"
  redis-database: "0"
  redis-sentinel-master: ""
  redis-sentinel-nodes: ""
  redis-ssl-enabled: "false"
  redis-connect-timeout: PT5S
  redis-timeout: PT5S

  # Public URL used for OAuth callback construction. Set this to the external
  # HTTPS origin when ingress is configured, for example https://skills.example.com.
  public-base-url: ""
  # Browser path prefix and optional explicit API base. Leave both blank for a
  # root deployment; for subpath deployment set web-base-path to /skillhub and
  # leave web-api-base-url blank to inherit it.
  web-base-path: ""
  web-api-base-url: ""
  # Optional absolute device authorization page. Blank derives it from public-base-url.
  device-auth-verification-uri: ""
  # Optional frontend-only override used in copied CLI install commands.
  cli-registry-url: ""
  # Enable only when a trusted ingress replaces X-Forwarded-Proto and direct
  # access to the web pod is blocked.
  trust-forwarded-proto: "false"

  # Scanner integration
  publish-allowed-file-extensions: ""
  download-analytics-retention-months: "12"
  security-scanner-enabled: "true"
  security-scanner-base-url: http://skillhub-scanner:8000
  security-scanner-mode: upload
  scan-consumer-enabled: "false"
  scanner-use-behavioral: "true"
  scanner-use-llm: "false"
  scanner-llm-provider: anthropic
  scanner-use-meta: "false"
  scanner-use-ai-defense: "false"
  scanner-use-virustotal: "false"
  scanner-use-trigger: "false"

  # Session and auth
  session-cookie-secure: "false"
  auth-direct-enabled: "false"
  auth-session-bootstrap-enabled: "false"
  local-registration-enabled: "false"
  global-namespace-auto-join-enabled: "false"

  # Bootstrap admin
  bootstrap-admin-enabled: "true"
  bootstrap-admin-user-id: docker-admin
  bootstrap-admin-username: admin
  bootstrap-admin-display-name: Platform Admin
  bootstrap-admin-email: admin@example.com

  # Built-in skills bootstrap from the upstream cloud manifest.
  builtin-skills-enabled: "true"

  # Optional Keycloak / OIDC provider metadata
  oauth2-keycloak-issuer-uri: https://keycloak.example.com/realms/skillhub
  oauth2-keycloak-scope: openid,profile,email
  oauth2-keycloak-client-name: Keycloak
---
