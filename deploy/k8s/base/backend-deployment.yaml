apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-server
  labels:
    app.kubernetes.io/name: skillhub-server
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-server
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend-python
          image: ghcr.io/iflytek/skillhub-server-python:edge
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Database
            - name: SKILLHUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: database-url

            # Redis
            - name: SKILLHUB_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: redis-url
                  optional: true
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-host
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-port
            - name: SPRING_DATA_REDIS_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-database
            - name: SPRING_DATA_REDIS_SENTINEL_MASTER
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-sentinel-master
                  optional: true
            - name: SPRING_DATA_REDIS_SENTINEL_NODES
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-sentinel-nodes
                  optional: true
            - name: SPRING_DATA_REDIS_SENTINEL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: redis-sentinel-username
                  optional: true
            - name: SPRING_DATA_REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: redis-sentinel-password
                  optional: true
            - name: SPRING_DATA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: redis-username
                  optional: true
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: redis-password
                  optional: true
            - name: SPRING_DATA_REDIS_SSL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-ssl-enabled
                  optional: true
            - name: SPRING_DATA_REDIS_CONNECT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-connect-timeout
                  optional: true
            - name: SPRING_DATA_REDIS_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-timeout
                  optional: true

            # Storage
            - name: SKILLHUB_STORAGE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-provider
            - name: SKILLHUB_STORAGE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-endpoint
            - name: SKILLHUB_STORAGE_S3_PROXY_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-proxy-endpoint
                  optional: true
            - name: SKILLHUB_STORAGE_S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-public-endpoint
                  optional: true
            - name: SKILLHUB_STORAGE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-bucket
            - name: SKILLHUB_STORAGE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-region
            - name: SKILLHUB_STORAGE_S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-force-path-style
            - name: SKILLHUB_STORAGE_S3_DISABLE_CHUNKED_ENCODING
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-disable-chunked-encoding
            - name: SKILLHUB_STORAGE_S3_AUTO_CREATE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-s3-auto-create-bucket
            - name: SKILLHUB_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: storage-s3-access-key
            - name: SKILLHUB_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: storage-s3-secret-key

            # Publish package policy
            - name: SKILLHUB_PUBLISH_ALLOWED_FILE_EXTENSIONS
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: publish-allowed-file-extensions
                  optional: true
            - name: SKILLHUB_DOWNLOAD_ANALYTICS_RETENTION_MONTHS
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: download-analytics-retention-months
                  optional: true

            # Scanner
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: security-scanner-enabled
            - name: SKILLHUB_SECURITY_SCANNER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: security-scanner-base-url
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: security-scanner-mode
            - name: SKILLHUB_SCAN_CONSUMER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scan-consumer-enabled
            - name: SKILLHUB_SCANNER_USE_BEHAVIORAL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-use-behavioral
            - name: SKILLHUB_SCANNER_USE_LLM
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-use-llm
            - name: SKILLHUB_SCANNER_LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-llm-provider
            - name: SKILLHUB_SCANNER_USE_META
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-use-meta
            - name: SKILLHUB_SCANNER_USE_AI_DEFENSE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-use-ai-defense
            - name: SKILLHUB_SCANNER_AI_DEFENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: scanner-ai-defense-api-key
                  optional: true
            - name: SKILLHUB_SCANNER_USE_VIRUSTOTAL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-use-virustotal
            - name: SKILLHUB_SCANNER_USE_TRIGGER
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scanner-use-trigger

            # Session and auth
            - name: SKILLHUB_SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: session-cookie-secure
            - name: SKILLHUB_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: public-base-url
                  optional: true
            - name: SKILLHUB_AUTH_DIRECT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: auth-direct-enabled
            - name: SKILLHUB_AUTH_SESSION_BOOTSTRAP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: auth-session-bootstrap-enabled
            - name: SKILLHUB_LOCAL_REGISTRATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: local-registration-enabled

            # Bootstrap admin
            - name: BOOTSTRAP_ADMIN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-enabled
            - name: BOOTSTRAP_ADMIN_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-user-id
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-username
            - name: BOOTSTRAP_ADMIN_DISPLAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-display-name
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-email
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: bootstrap-admin-password
                  optional: true
            - name: SKILLHUB_BUILTIN_SKILLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: builtin-skills-enabled

            # Keycloak / generic OIDC provider. Spring-style names are kept so
            # existing Java deployment values can be reused during cutover.
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-keycloak-client-id
                  optional: true
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-keycloak-client-secret
                  optional: true
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_PROVIDER
              value: keycloak
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE
              value: authorization_code
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI
              value: "{baseUrl}/login/oauth2/code/{registrationId}"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: oauth2-keycloak-scope
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: oauth2-keycloak-client-name
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: oauth2-keycloak-issuer-uri
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
