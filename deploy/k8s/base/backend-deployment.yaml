apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-server
  labels:
    app.kubernetes.io/name: skillhub-server
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-server
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend-python
          image: ghcr.io/iflytek/skillhub-server-python:edge
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Database
            - name: SKILLHUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: database-url

            # Redis
            - name: SKILLHUB_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-url

            # Storage
            - name: SKILLHUB_STORAGE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-base-path

            # Scanner
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: security-scanner-enabled
            - name: SKILLHUB_SECURITY_SCANNER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: security-scanner-base-url
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: security-scanner-mode
            - name: SKILLHUB_SCAN_CONSUMER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: scan-consumer-enabled

            # Session and auth
            - name: SKILLHUB_SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: session-cookie-secure
            - name: SKILLHUB_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: public-base-url
                  optional: true
            - name: SKILLHUB_AUTH_DIRECT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: auth-direct-enabled
            - name: SKILLHUB_AUTH_SESSION_BOOTSTRAP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: auth-session-bootstrap-enabled

            # Bootstrap admin
            - name: BOOTSTRAP_ADMIN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-enabled
            - name: BOOTSTRAP_ADMIN_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-user-id
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-username
            - name: BOOTSTRAP_ADMIN_DISPLAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-display-name
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-email
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: bootstrap-admin-password
                  optional: true

            # OAuth2 providers
            - name: OAUTH2_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-github-client-id
                  optional: true
            - name: OAUTH2_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-github-client-secret
                  optional: true
            - name: OAUTH2_GITLAB_BASE_URI
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: oauth2-gitlab-base-uri
                  optional: true
            - name: OAUTH2_GITLAB_DISPLAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: oauth2-gitlab-display-name
                  optional: true
            - name: OAUTH2_GITLAB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-gitlab-client-id
                  optional: true
            - name: OAUTH2_GITLAB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-gitlab-client-secret
                  optional: true
          volumeMounts:
            - name: skillhub-storage
              mountPath: /var/lib/skillhub/storage
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: skillhub-storage
          persistentVolumeClaim:
            claimName: skillhub-storage-pvc
