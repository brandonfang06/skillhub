apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-web
  labels:
    app.kubernetes.io/name: skillhub-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-web
    spec:
      containers:
        - name: web
          image: ghcr.io/iflytek/skillhub-web:edge
          imagePullPolicy: IfNotPresent
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: http://skillhub-server:8080
            - name: SKILLHUB_LOCAL_REGISTRATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: local-registration-enabled
            - name: SKILLHUB_WEB_COLLECTIONS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: web-collections-enabled
            - name: SKILLHUB_WEB_GITLAB_IMPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: web-gitlab-import-enabled
            - name: SKILLHUB_WEB_CLI_NPM_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: web-cli-npm-registry
            - name: SKILLHUB_WEB_CLI_PACKAGE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: web-cli-package
            - name: SKILLHUB_WEB_CLI_VERSION
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: web-cli-version
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
