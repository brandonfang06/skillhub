  SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_AUTHENTICATED: ""
  SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_ANONYMOUS: ""
  SKILLHUB_RATELIMIT_CATEGORIES_SEARCH_WINDOW_SECONDS: ""
