apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-web
  labels:
    app.kubernetes.io/name: skillhub-web
    app.kubernetes.io/part-of: skillhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-web
        app.kubernetes.io/part-of: skillhub
    spec:
      containers:
        - name: web
          image: ghcr.io/iflytek/skillhub-web:edge
          imagePullPolicy: IfNotPresent
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: http://skillhub-server:8080
            - name: SKILLHUB_LOCAL_REGISTRATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: local-registration-enabled
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
