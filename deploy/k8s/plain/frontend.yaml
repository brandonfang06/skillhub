# Plain Kubernetes manifests for the SkillHub frontend.
# Apply with: kubectl -n skillhub apply -f deploy/k8s/plain/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: skillhub-web
  labels:
    app.kubernetes.io/name: skillhub-web
    app.kubernetes.io/part-of: skillhub
spec:
  selector:
    app.kubernetes.io/name: skillhub-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-web
  labels:
    app.kubernetes.io/name: skillhub-web
    app.kubernetes.io/part-of: skillhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-web
        app.kubernetes.io/part-of: skillhub
    spec:
      containers:
        - name: web
          image: ghcr.io/iflytek/skillhub-web:edge
          imagePullPolicy: IfNotPresent
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: http://skillhub-server:8080
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
