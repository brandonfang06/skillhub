services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skillhub-smoke
      MINIO_ROOT_PASSWORD: skillhub-smoke-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  skill-scanner:
    build:
      context: scanner
    image: skillhub-scanner:oss-import-smoke

  server:
    build:
      context: .
      dockerfile: server-python/Dockerfile
    image: skillhub-server-python:oss-import-smoke
    environment:
      SKILLHUB_STORAGE_PROVIDER: s3
      SKILLHUB_STORAGE_S3_ENDPOINT: http://minio:9000
      SKILLHUB_STORAGE_S3_BUCKET: skillhub-oss-import-smoke
      SKILLHUB_STORAGE_S3_ACCESS_KEY: skillhub-smoke
      SKILLHUB_STORAGE_S3_SECRET_KEY: skillhub-smoke-secret
      SKILLHUB_STORAGE_S3_REGION: us-east-1
      SKILLHUB_STORAGE_S3_FORCE_PATH_STYLE: "true"
      SKILLHUB_STORAGE_S3_DISABLE_CHUNKED_ENCODING: "false"
      SKILLHUB_STORAGE_S3_AUTO_CREATE_BUCKET: "true"
      SKILLHUB_SCAN_CONSUMER_ENABLED: "true"
      SKILLHUB_SECURITY_SCANNER_ENABLED: "true"
      SKILLHUB_AUTH_DIRECT_ENABLED: "true"
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_PASSWORD: SmokeAdminPass123!
    depends_on:
      minio:
        condition: service_healthy
      skill-scanner:
        condition: service_healthy

  web:
    build:
      context: web
    image: skillhub-web:oss-import-smoke
    environment:
      SKILLHUB_PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-58080}
      SKILLHUB_WEB_BASE_PATH: ""

  web-subpath:
    build:
      context: web
    image: skillhub-web:oss-import-smoke
    ports:
      - "${SUBPATH_WEB_PORT:-58082}:80"
    environment:
      SKILLHUB_API_UPSTREAM: http://server:8080
      SKILLHUB_PUBLIC_BASE_URL: http://localhost:${SUBPATH_WEB_PORT:-58082}/skillhub
      SKILLHUB_WEB_BASE_PATH: /skillhub
      SKILLHUB_WEB_API_BASE_URL: ""
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio_data:
